function Button({ children, onClick, variant = "primary", icon: Icon, className = "", type = "button", disabled }) {

    <button
      type={type}
      onClick={onClick}
      disabled={disabled}

function SmartDentalCare() {
  const [role, setRole] = useState("admin");
  const [tab, setTab] = useState("dashboard");
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  // Data
  const [doctors] = useState(initialDoctors);
  const [patients, setPatients] = useState(initialPatients);
  const [treatments, setTreatments] = useState(initialTreatments);
  const [medicines, setMedicines] = useState(initialMedicines);
  const [appointments, setAppointments] = useState(initialAppointments);
  const [invoices, setInvoices] = useState(initialInvoices);
  const [auditLog, setAuditLog] = useState([
    { id: uid("aud"), time: "2026-08-30 09:02", user: "Admin", action: "Confirmed appointment A1002 (Priya Sundaram)" },
    { id: uid("aud"), time: "2026-08-29 15:35", user: "Dr. Mahesh Kumar", action: "Completed treatment for Arun Das — Dental Filling" },
    { id: uid("aud"), time: "2026-08-29 15:40", user: "Receptionist", action: "Generated invoice INV-2026-0061" },
  ]);
  const [notifications, setNotifications] = useState([
    { id: uid("ntf"), type: "payment", level: "high", title: "Payment pending — Ravi Kumar", body: "Outstanding ₹4,200 on INV-2026-0055", time: "10:31 AM" },
    { id: uid("ntf"), type: "appointment", level: "info", title: "New appointment request", body: "Meena Iyer requested Dental Cleaning for today", time: "09:12 AM" },
    { id: uid("ntf"), type: "clinic", level: "info", title: "Doctor assigned", body: "Dr. Karthik Iyer assigned to Arun Das (Implants)", time: "08:50 AM" },
  ]);

  // Settings
  const [approvalMode, setApprovalMode] = useState("admin"); // admin | doctor | auto
  const [qrEnabled, setQrEnabled] = useState(true);
  const [qrImage, setQrImage] = useState(null);
  const [upiId, setUpiId] = useState("smartdentalcare@okhdfc");
  const [sheetsSync, setSheetsSync] = useState(false);
  const [sheetsConnected, setSheetsConnected] = useState(false);
  const [permissions, setPermissions] = useState({
    receptionistBilling: true, receptionistReschedule: true,
    downloadExcel: true, downloadCSV: true, downloadPDF: true,
    doctorReports: true, financialReports: false,
  });

  // Check-in payment alert modal
  const [payAlert, setPayAlert] = useState(null); // { patient, invoice }
  const [collectModal, setCollectModal] = useState(null); // invoice being paid

  // "logged in as" patient for patient-role demo
  const currentPatientId = "p1";
  const currentDoctorId = "d1";

  const showToast = (msg, tone = "success") => {
    setToast({ msg, tone });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3200);
  };

  const addAudit = (user, action) => {
    setAuditLog((prev) => [{ id: uid("aud"), time: "2026-08-30 " + now().toTimeString().slice(0, 5), user, action }, ...prev]);
  };

  const outstandingFor = (patientId) =>
    invoices.filter((i) => i.patientId === patientId && i.status !== "Paid")
      .reduce((sum, i) => sum + (i.total - i.paid), 0);

  const invoicesFor = (patientId) => invoices.filter((i) => i.patientId === patientId);

  const doctorName = (id) => doctors.find((d) => d.id === id)?.name || "Unassigned";
  const patientName = (id) => patients.find((p) => p.id === id)?.name || "Unknown";
  const treatmentName = (id) => treatments.find((t) => t.id === id)?.name || "—";
  const treatmentPrice = (id) => treatments.find((t) => t.id === id)?.price || 0;

  /* -------- Actions -------- */
  const handleCheckIn = (patientId, appointmentId) => {
    setAppointments((prev) => prev.map((a) => (a.id === appointmentId ? { ...a, status: "Checked In" } : a)));
    const outstanding = outstandingFor(patientId);
    const patient = patients.find((p) => p.id === patientId);
    addAudit(role === "admin" ? "Admin" : "Receptionist", `Checked in patient ${patient.name} (Appt ${appointmentId})`);
    if (outstanding > 0) {
      const inv = invoices.find((i) => i.patientId === patientId && i.status !== "Paid");
      setPayAlert({ patient, invoice: inv, outstanding });
      showToast(`⚠️ ${patient.name} has a pending payment of ${fmtINR(outstanding)}`, "warn");
    } else {
      showToast(`${patient.name} checked in — no pending payments.`, "success");
    }
  };

  const collectPayment = (invoiceId, amount, method) => {
    setInvoices((prev) =>
      prev.map((inv) => {
        if (inv.id !== invoiceId) return inv;
        const paid = Math.min(inv.total, inv.paid + amount);
        const status = paid >= inv.total ? "Paid" : "Partial";
        return { ...inv, paid, status };
      })
    );
    addAudit(role === "admin" ? "Admin" : "Receptionist", `Collected ${fmtINR(amount)} via ${method} on ${invoiceId}`);
    setNotifications((prev) => [{ id: uid("ntf"), type: "payment", level: "success", title: "Payment received", body: `${fmtINR(amount)} via ${method} — ${invoiceId}`, time: "Just now" }, ...prev]);
    showToast(`Payment of ${fmtINR(amount)} recorded for ${invoiceId}.`, "success");
    setCollectModal(null);
    setPayAlert(null);
  };

  const remindLater = (invoiceId, patientName) => {
    addAudit(role === "admin" ? "Admin" : "Receptionist", `Marked payment reminder for later — ${invoiceId}`);
    showToast(`Reminder set for ${patientName}. You can follow up later.`, "info");
    setPayAlert(null);
  };

  const updateApptStatus = (id, status) => {
    setAppointments((prev) => prev.map((a) => (a.id === id ? { ...a, status } : a)));
    addAudit(role === "admin" ? "Admin" : role === "doctor" ? doctorName(currentDoctorId) : "Receptionist", `Set appointment ${id} to "${status}"`);
    showToast(`Appointment ${id} updated to ${status}.`);
  };

  const createAppointment = (data) => {
    const id = "A" + (1000 + appointments.length + Math.floor(Math.random() * 90) + 9);
    let status = "Confirmed";
    let confirmation = "Auto Booking";
    if (approvalMode === "admin") { status = "Waiting for Admin Approval"; confirmation = "Admin Fixed"; }
    else if (approvalMode === "doctor") { status = "Waiting for Doctor Approval"; confirmation = "Doctor Fixed"; }
    const appt = { id, ...data, status, notes: data.notes || "", createdBy: role === "patient" ? "Patient Portal" : role[0].toUpperCase() + role.slice(1), confirmation };
    setAppointments((prev) => [appt, ...prev]);
    addAudit(role === "patient" ? patientName(currentPatientId) : role, `Requested appointment ${id} (${treatmentName(data.treatmentId)})`);
    showToast(`Appointment ${id} created — ${status}.`);
  };

  const addTreatment = (t) => { setTreatments((p) => [{ id: uid("t"), active: true, ...t }, ...p]); addAudit("Admin", `Added treatment "${t.name}"`); showToast("Treatment added."); };
  const editTreatment = (id, t) => { setTreatments((p) => p.map((x) => (x.id === id ? { ...x, ...t } : x))); addAudit("Admin", `Edited treatment "${t.name}"`); showToast("Treatment updated."); };
  const deleteTreatment = (id) => { setTreatments((p) => p.filter((x) => x.id !== id)); addAudit("Admin", "Deleted a treatment"); showToast("Treatment removed."); };
  const toggleTreatment = (id) => setTreatments((p) => p.map((x) => (x.id === id ? { ...x, active: !x.active } : x)));

  const addMedicine = (m) => { setMedicines((p) => [{ id: uid("m"), active: true, ...m }, ...p]); addAudit("Admin", `Added medicine "${m.name}"`); showToast("Medicine added."); };
  const editMedicine = (id, m) => { setMedicines((p) => p.map((x) => (x.id === id ? { ...x, ...m } : x))); addAudit("Admin", `Edited medicine "${m.name}"`); showToast("Medicine updated."); };
  const deleteMedicine = (id) => { setMedicines((p) => p.filter((x) => x.id !== id)); addAudit("Admin", "Deleted a medicine"); showToast("Medicine removed."); };
  const toggleMedicine = (id) => setMedicines((p) => p.map((x) => (x.id === id ? { ...x, active: !x.active } : x)));

  const createInvoice = (patientId, doctorId, items, discount = 0) => {
    const subtotal = items.reduce((s, i) => s + i.amount, 0);
    const total = Math.max(0, subtotal - discount);
    const id = "INV-2026-" + (100 + invoices.length + Math.floor(Math.random() * 50));
    const inv = { id, patientId, doctorId, date: todayISO(), items, discount, tax: 0, total, paid: 0, status: "Pending" };
    setInvoices((p) => [inv, ...p]);
    addAudit(role === "admin" ? "Admin" : "Receptionist", `Generated invoice ${id} for ${patientName(patientId)}`);
    showToast(`Invoice ${id} created for ${fmtINR(total)}.`);
    return inv;
  };

  /* -------- Downloads -------- */
  const buildDailyReportRows = () =>
    invoices.map((inv) => ({
      Date: inv.date, Patient: patientName(inv.patientId), Doctor: doctorName(inv.doctorId),
      "Invoice No": inv.id, "Total Amount": inv.total, "Paid Amount": inv.paid,
      "Outstanding": inv.total - inv.paid, Status: inv.status,
    }));

  const downloadXLSX = (permKey, filename) => {
    if (!permissions[permKey]) { showToast("You don't have permission to download this format.", "warn"); return; }
    const rows = buildDailyReportRows();
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Report");
    XLSX.writeFile(wb, filename);
    addAudit(role, `Downloaded report ${filename}`);
    showToast(`${filename} downloaded.`);
  };

  const downloadCSV = (permKey, filename) => {
    if (!permissions[permKey]) { showToast("You don't have permission to download this format.", "warn"); return; }
    const rows = buildDailyReportRows();
    const headers = Object.keys(rows[0] || {});
    const csv = [headers.join(","), ...rows.map((r) => headers.map((h) => r[h]).join(","))].join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    addAudit(role, `Downloaded report ${filename}`);
    showToast(`${filename} downloaded.`);
  };

  const simulatePDF = (permKey, filename) => {
    if (!permissions[permKey]) { showToast("You don't have permission to download this format.", "warn"); return; }
    addAudit(role, `Downloaded report ${filename}`);
    showToast(`${filename} generated and saved to Downloads.`);
  };

  /* ============================== DERIVED ============================== */
  const visibleNav = NAV.filter((n) => n.roles.includes(role));
  const mobileNav = NAV.filter((n) => MOBILE_KEYS[role].includes(n.key));

  React.useEffect(() => {
    if (!visibleNav.find((n) => n.key === tab)) setTab("dashboard");
    // eslint-disable-next-line
  }, [role]);

  const todaysAppointments = appointments.filter((a) => a.date === todayISO());
  const roleAppointments =
    role === "doctor" ? appointments.filter((a) => a.doctorId === currentDoctorId) :
    role === "patient" ? appointments.filter((a) => a.patientId === currentPatientId) :
    appointments;

  return (
    <div className="w-full min-h-screen flex" style={{ background: C.bg, fontFamily: "'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif" }}>
      {/* ===== DESKTOP SIDEBAR ===== */}
      <aside className="hidden md:flex md:flex-col w-64 shrink-0" style={{ background: C.teal900 }}>
        <div className="flex items-center gap-2.5 px-5 py-5">
          <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 p-1" style={{ background: "#fff" }}>
            <img src={LOGO_DATA_URI} alt="Clinic logo" className="w-full h-full object-contain" />
          </div>
          <div>
            <div className="text-white font-bold text-sm leading-tight">{CLINIC_NAME}</div>
            <div className="text-[11px]" style={{ color: "#8FB8B0" }}>Clinic Management</div>
          </div>
        </div>

        <nav className="flex-1 px-3 mt-2 space-y-0.5 overflow-y-auto">
          {visibleNav.map((item) => {
            const active = tab === item.key;
            const Icon = item.icon;
            return (
              <button
                key={item.key}
                onClick={() => setTab(item.key)}
                className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition"
                style={{
                  background: active ? "rgba(255,255,255,0.12)" : "transparent",
                  color: active ? "#fff" : "#B9D6D0",
                }}
              >
                <Icon size={17} />
                <span className="flex-1 text-left">{item.label}</span>
                {item.key === "notifications" && notifications.length > 0 && (
                  <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full" style={{ background: C.red, color: "#fff" }}>
                    {notifications.length}
                  </span>
                )}
              </button>
            );
          })}
        </nav>

        <div className="px-4 py-4 mx-3 mb-3 rounded-xl" style={{ background: "rgba(255,255,255,0.06)" }}>
          <div className="text-[11px] font-semibold mb-1" style={{ color: "#8FB8B0" }}>VIEWING AS</div>
          <RoleSwitcher role={role} setRole={setRole} light />
        </div>
      </aside>

      {/* ===== MOBILE TOP BAR + DRAWER ===== */}
      <div className="md:hidden fixed top-0 left-0 right-0 z-40 flex items-center justify-between px-4 py-3" style={{ background: C.teal900 }}>
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 p-0.5" style={{ background: "#fff" }}>
            <img src={LOGO_DATA_URI} alt="Clinic logo" className="w-full h-full object-contain" />
          </div>
          <span className="text-white font-bold text-sm">{CLINIC_NAME}</span>
        </div>
        <button onClick={() => setMobileMenuOpen(true)} className="p-1.5"><Menu size={22} color="#fff" /></button>
      </div>
      {mobileMenuOpen && (
        <div className="md:hidden fixed inset-0 z-50 flex justify-end" style={{ background: "rgba(11,32,29,0.5)" }} onClick={() => setMobileMenuOpen(false)}>
          <div onClick={(e) => e.stopPropagation()} className="w-72 h-full p-4" style={{ background: C.teal900 }}>
            <div className="flex items-center justify-between mb-4">
              <span className="text-white font-bold text-sm">Menu</span>
              <button onClick={() => setMobileMenuOpen(false)}><X size={20} color="#fff" /></button>
            </div>
            <div className="mb-4 px-1">
              <div className="text-[11px] font-semibold mb-1.5" style={{ color: "#8FB8B0" }}>VIEWING AS</div>
              <RoleSwitcher role={role} setRole={setRole} light />
            </div>
            <nav className="space-y-0.5">
              {visibleNav.map((item) => {
                const Icon = item.icon;
                return (
                  <button
                    key={item.key}
                    onClick={() => { setTab(item.key); setMobileMenuOpen(false); }}
                    className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium"
                    style={{ background: tab === item.key ? "rgba(255,255,255,0.12)" : "transparent", color: tab === item.key ? "#fff" : "#B9D6D0" }}
                  >
                    <Icon size={17} /><span>{item.label}</span>
                  </button>
                );
              })}
            </nav>
          </div>
        </div>
      )}

      {/* ===== MAIN ===== */}
      <div className="flex-1 min-w-0 flex flex-col pt-14 md:pt-0 pb-20 md:pb-0">
        {/* Top bar (desktop) */}
        <div className="hidden md:flex items-center justify-between px-8 py-5 sticky top-0 z-30" style={{ background: C.bg }}>
          <div>
            <div className="text-xs font-semibold" style={{ color: C.faint }}>{now().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}</div>
            <div className="text-xl font-bold" style={{ color: C.ink }}>{visibleNav.find((n) => n.key === tab)?.label}</div>
          </div>
          <div className="flex items-center gap-3">
            <div className="relative">
              <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2" color={C.faint} />
              <input placeholder="Search patients, invoices, appointments…" className="pl-9 pr-4 py-2.5 rounded-xl text-sm w-80" style={{ ...inputStyle, width: 320 }} />
            </div>
            <button onClick={() => setTab("notifications")} className="relative w-10 h-10 rounded-xl flex items-center justify-center" style={{ background: C.card, border: `1px solid ${C.border}` }}>
              <Bell size={17} color={C.teal800} />
              {notifications.length > 0 && <span className="absolute -top-1 -right-1 w-4 h-4 rounded-full text-[9px] font-bold flex items-center justify-center text-white" style={{ background: C.red }}>{notifications.length}</span>}
            </button>
            <div className="flex items-center gap-2 pl-2">
              <Avatar name={role === "patient" ? patientName(currentPatientId) : role === "doctor" ? doctorName(currentDoctorId) : role[0].toUpperCase() + role.slice(1)} />
              <div className="hidden lg:block">
                <div className="text-sm font-semibold" style={{ color: C.ink }}>
                  {role === "patient" ? patientName(currentPatientId) : role === "doctor" ? doctorName(currentDoctorId) : role[0].toUpperCase() + role.slice(1)}
                </div>
                <div className="text-[11px] capitalize" style={{ color: C.faint }}>{role}</div>
              </div>
            </div>
          </div>
        </div>

        <div className="px-4 md:px-8 pb-8">
          {tab === "dashboard" && (
            <DashboardPage
              role={role} doctors={doctors} patients={patients} appointments={appointments}
              invoices={invoices} todaysAppointments={todaysAppointments} outstandingFor={outstandingFor}
              patientName={patientName} doctorName={doctorName} treatmentName={treatmentName}
              currentPatientId={currentPatientId} currentDoctorId={currentDoctorId}
              setTab={setTab}
            />
          )}

          {tab === "appointments" && (
            <AppointmentsPage
              role={role} appointments={roleAppointments} doctors={doctors} patients={patients} treatments={treatments}
              patientName={patientName} doctorName={doctorName} treatmentName={treatmentName}
              updateApptStatus={updateApptStatus} createAppointment={createAppointment}
              approvalMode={approvalMode} currentPatientId={currentPatientId}
            />
          )}

          {tab === "checkin" && (
            <CheckInPage
              patients={patients} appointments={appointments} doctorName={doctorName} treatmentName={treatmentName}
              outstandingFor={outstandingFor} handleCheckIn={handleCheckIn} todaysAppointments={todaysAppointments}
            />
          )}

          {tab === "patients" && (
            <PatientsPage
              patients={patients} appointments={appointments} invoices={invoices} doctorName={doctorName}
              treatmentName={treatmentName} outstandingFor={outstandingFor} invoicesFor={invoicesFor}
              role={role}
            />
          )}

          {tab === "treatments" && (
            <TreatmentsPage treatments={treatments} addTreatment={addTreatment} editTreatment={editTreatment} deleteTreatment={deleteTreatment} toggleTreatment={toggleTreatment} />
          )}

          {tab === "medicines" && (
            <MedicinesPage medicines={medicines} addMedicine={addMedicine} editMedicine={editMedicine} deleteMedicine={deleteMedicine} toggleMedicine={toggleMedicine} />
          )}

          {tab === "billing" && (
            <BillingPage
              role={role} invoices={role === "patient" ? invoices.filter((i) => i.patientId === currentPatientId) : invoices}
              patients={patients} doctors={doctors} treatments={treatments} medicines={medicines}
              patientName={patientName} doctorName={doctorName} createInvoice={createInvoice}
              collectPayment={collectPayment} qrEnabled={qrEnabled} qrImage={qrImage} upiId={upiId}
              currentPatientId={currentPatientId}
            />
          )}

          {tab === "reports" && (
            <ReportsPage
              role={role} invoices={invoices} appointments={appointments} treatments={treatments} doctors={doctors}
              patientName={patientName} doctorName={doctorName} downloadXLSX={downloadXLSX} downloadCSV={downloadCSV}
              simulatePDF={simulatePDF} permissions={permissions} sheetsSync={sheetsSync} setSheetsSync={setSheetsSync}
              sheetsConnected={sheetsConnected} setSheetsConnected={setSheetsConnected} showToast={showToast}
              currentDoctorId={currentDoctorId}
            />
          )}

          {tab === "notifications" && (
            <NotificationsPage notifications={notifications} setNotifications={setNotifications} />
          )}

          {tab === "settings" && (
            <SettingsPage
              approvalMode={approvalMode} setApprovalMode={setApprovalMode}
              qrEnabled={qrEnabled} setQrEnabled={setQrEnabled} qrImage={qrImage} setQrImage={setQrImage}
              upiId={upiId} setUpiId={setUpiId} permissions={permissions} setPermissions={setPermissions}
              showToast={showToast}
            />
          )}

          {tab === "audit" && <AuditPage auditLog={auditLog} />}
        </div>
      </div>

      {/* ===== MOBILE BOTTOM NAV ===== */}
      <div className="md:hidden fixed bottom-0 left-0 right-0 z-40 flex items-stretch" style={{ background: C.teal900, borderTop: "1px solid rgba(255,255,255,0.08)" }}>
        {mobileNav.map((item) => {
          const Icon = item.icon;
          const active = tab === item.key;
          return (
            <button key={item.key} onClick={() => setTab(item.key)} className="flex-1 flex flex-col items-center justify-center gap-0.5 py-2.5">
              <Icon size={19} color={active ? "#fff" : "#7FA69E"} />
              <span className="text-[10px] font-medium" style={{ color: active ? "#fff" : "#7FA69E" }}>{item.label}</span>
            </button>
          );
        })}
      </div>

      {/* ===== PENDING PAYMENT ALERT MODAL ===== */}
      <Modal open={!!payAlert} onClose={() => setPayAlert(null)} title="Pending Payment Alert" width={440}>
        {payAlert && (
          <div>
            <div className="flex items-center gap-3 p-3.5 rounded-xl mb-4" style={{ background: C.redBg }}>
              <AlertTriangle size={22} color={C.red} className="shrink-0" />
              <div>
                <div className="font-bold text-sm" style={{ color: C.red }}>Outstanding balance found on check-in</div>
                <div className="text-xs mt-0.5" style={{ color: C.red }}>This patient has an unpaid or partially paid invoice.</div>
              </div>
            </div>
            <div className="flex items-center gap-3 mb-4">
              <Avatar name={payAlert.patient.name} size={44} />
              <div>
                <div className="font-bold text-sm" style={{ color: C.ink }}>{payAlert.patient.name}</div>
                <div className="text-xs" style={{ color: C.sub }}>{payAlert.patient.phone}</div>
              </div>
            </div>
            <div className="rounded-xl p-4 mb-4 space-y-2" style={{ background: C.teal50 }}>
              <Row label="Outstanding Payment" value={<b style={{ color: C.red }}>{fmtINR(payAlert.outstanding)}</b>} />
              <Row label="Previous Invoice" value={payAlert.invoice?.id} />
              <Row label="Status" value={<Badge>{payAlert.invoice?.status}</Badge>} />
            </div>
            <div className="grid grid-cols-2 gap-2">
              <Button variant="primary" icon={Wallet} onClick={() => { setCollectModal(payAlert.invoice); }}>Collect Payment</Button>
              <Button variant="ghost" onClick={() => setPayAlert(null)}>View Invoice</Button>
              <Button variant="subtle" className="col-span-2" onClick={() => remindLater(payAlert.invoice.id, payAlert.patient.name)}>Remind Later</Button>
            </div>
          </div>
        )}
      </Modal>

      {/* ===== COLLECT PAYMENT MODAL ===== */}
      <CollectPaymentModal invoice={collectModal} onClose={() => setCollectModal(null)} onCollect={collectPayment} qrEnabled={qrEnabled} qrImage={qrImage} upiId={upiId} />

      {/* ===== TOAST ===== */}
      {toast && (
        <div className="fixed bottom-24 md:bottom-6 left-1/2 -translate-x-1/2 z-[60] px-4 py-3 rounded-xl text-sm font-semibold shadow-lg flex items-center gap-2"
          style={{ background: toast.tone === "warn" ? C.red : toast.tone === "info" ? C.teal800 : C.teal900, color: "#fff", maxWidth: "90vw" }}>
          {toast.tone === "warn" ? <AlertTriangle size={16} /> : <CheckCircle2 size={16} />}
          {toast.msg}
        </div>
      )}
    </div>
  );
}

function Row({ label, value }) {
  return (
    <div className="flex items-center justify-between text-sm">
      <span style={{ color: C.sub }}>{label}</span>
      <span style={{ color: C.ink, fontWeight: 600 }}>{value}</span>
    </div>
  );
}

function RoleSwitcher({ role, setRole, light }) {
  const roles = [
    { key: "admin", label: "Admin", icon: ShieldCheck },
    { key: "doctor", label: "Doctor", icon: Stethoscope },
    { key: "receptionist", label: "Receptionist", icon: ClipboardList },
    { key: "patient", label: "Patient", icon: Users },
  ];
  return (
    <div className="grid grid-cols-2 gap-1.5">
      {roles.map((r) => {
        const Icon = r.icon;
        const active = role === r.key;
        return (
          <button
            key={r.key}
            onClick={() => setRole(r.key)}
            className="flex items-center gap-1.5 px-2 py-2 rounded-lg text-xs font-semibold"
            style={{
              background: active ? (light ? "#fff" : C.teal700) : light ? "rgba(255,255,255,0.08)" : C.teal50,
              color: active ? (light ? C.teal900 : "#fff") : light ? "#CFE4DF" : C.teal800,
            }}
          >
            <Icon size={13} /> {r.label}
          </button>
        );
      })}
    </div>
  );
}

/* ============================== DASHBOARD ============================== */
function DashboardPage({ role, doctors, patients, appointments, invoices, todaysAppointments, outstandingFor, patientName, doctorName, treatmentName, currentPatientId, currentDoctorId, setTab }) {
  const totalOutstanding = invoices.reduce((s, i) => s + (i.total - i.paid), 0);
  const monthlyRevenue = invoices.reduce((s, i) => s + i.paid, 0);
  const pendingAppts = appointments.filter((a) => a.status.startsWith("Waiting") || a.status === "Pending").length;
  const checkedIn = todaysAppointments.filter((a) => a.status === "Checked In").length;

  const treatmentPopularity = useMemo(() => {
    const map = {};
    appointments.forEach((a) => { map[a.treatmentId] = (map[a.treatmentId] || 0) + 1; });
    return Object.entries(map).map(([id, count]) => ({ name: treatmentName(id), value: count })).sort((a, b) => b.value - a.value).slice(0, 5);
  }, [appointments]);

  const paymentMethods = [{ name: "Cash", value: 4 }, { name: "UPI", value: 6 }, { name: "Card", value: 2 }, { name: "QR", value: 3 }];

  if (role === "patient") {
    const myAppts = appointments.filter((a) => a.patientId === currentPatientId);
    const myOutstanding = outstandingFor(currentPatientId);
    const next = myAppts.filter((a) => a.date >= todayISO()).sort((a, b) => a.date.localeCompare(b.date))[0];
    return (
      <div className="space-y-5">
        <Card className="p-5" style={{ background: `linear-gradient(135deg, ${C.teal800}, ${C.teal600})` }}>
          <div className="text-white">
            <div className="text-sm opacity-80">Welcome back,</div>
            <div className="text-2xl font-bold">{patientName(currentPatientId)}</div>
          </div>
        </Card>
        <div className="grid grid-cols-2 gap-3">
          <StatCard icon={CalendarDays} label="Upcoming Visits" value={myAppts.filter((a) => a.date >= todayISO()).length} />
          <StatCard icon={IndianRupee} label="Outstanding" value={fmtINR(myOutstanding)} tone={myOutstanding > 0 ? C.red : C.green} />
        </div>
        {next && (
          <Card className="p-5">
            <div className="text-xs font-semibold mb-2" style={{ color: C.sub }}>NEXT APPOINTMENT</div>
            <div className="flex items-center justify-between">
              <div>
                <div className="font-bold" style={{ color: C.ink }}>{treatmentName(next.treatmentId)}</div>
                <div className="text-sm mt-0.5" style={{ color: C.sub }}>{doctorName(next.doctorId)} · {fmtDate(next.date)} at {next.time}</div>
              </div>
              <Badge>{next.status}</Badge>
            </div>
          </Card>
        )}
        {myOutstanding > 0 && (
          <Card className="p-5" style={{ background: C.redBg, border: "1px solid #F3D0D0" }}>
            <div className="flex items-center gap-2 font-bold text-sm mb-1" style={{ color: C.red }}><AlertTriangle size={16} /> Payment due</div>
            <div className="text-sm" style={{ color: C.red }}>You have an outstanding balance of {fmtINR(myOutstanding)}. Visit Billing to view and pay your invoice.</div>
            <Button variant="danger" className="mt-3" onClick={() => setTab("billing")}>Go to Billing</Button>
          </Card>
        )}
      </div>
    );
  }

  if (role === "doctor") {
    const mine = appointments.filter((a) => a.doctorId === currentDoctorId && a.date === todayISO());
    return (
      <div className="space-y-5">
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
          <StatCard icon={CalendarDays} label="Today's Patients" value={mine.length} />
          <StatCard icon={CheckCircle2} label="Checked In" value={mine.filter((a) => a.status === "Checked In").length} tone={C.green} />
          <StatCard icon={Clock} label="Awaiting Approval" value={appointments.filter((a) => a.doctorId === currentDoctorId && a.status === "Waiting for Doctor Approval").length} tone={C.amber} />
          <StatCard icon={ListChecks} label="Completed (7d)" value={appointments.filter((a) => a.doctorId === currentDoctorId && a.status === "Completed").length} />
        </div>
        <Card className="p-5">
          <SectionHeader title="Today's Schedule" subtitle={doctorName(currentDoctorId)} />
          <div className="space-y-2">
            {mine.length === 0 && <Empty icon={CalendarDays} title="No appointments today" />}
            {mine.map((a) => (
              <div key={a.id} className="flex items-center justify-between p-3 rounded-xl" style={{ background: C.teal50 }}>
                <div className="flex items-center gap-3">
                  <Avatar name={patientName(a.patientId)} size={34} />
                  <div>
                    <div className="text-sm font-semibold" style={{ color: C.ink }}>{patientName(a.patientId)}</div>
                    <div className="text-xs" style={{ color: C.sub }}>{treatmentName(a.treatmentId)} · {a.time}</div>
                  </div>
                </div>
                <Badge>{a.status}</Badge>
              </div>
            ))}
          </div>
        </Card>
      </div>
    );
  }

  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard icon={Users} label="Total Patients" value={patients.length} sub="+2 this week" />
        <StatCard icon={CalendarDays} label="Today's Appointments" value={todaysAppointments.length} />
        <StatCard icon={Clock} label="Pending Approvals" value={pendingAppts} tone={C.amber} />
        <StatCard icon={UserCheck} label="Checked-In Today" value={checkedIn} tone={C.teal600} />
        <StatCard icon={TrendingUp} label="Monthly Revenue" value={fmtINR(monthlyRevenue)} tone={C.green} />
        <StatCard icon={AlertTriangle} label="Outstanding Amount" value={fmtINR(totalOutstanding)} tone={C.red} />
        <StatCard icon={Stethoscope} label="Doctors On Duty" value={doctors.length} />
        <StatCard icon={CheckCircle2} label="Confirmed Today" value={todaysAppointments.filter((a) => a.status === "Confirmed").length} tone={C.green} />

/* ============================== APPOINTMENTS ============================== */
function AppointmentsPage({ role, appointments, doctors, patients, treatments, patientName, doctorName, treatmentName, updateApptStatus, createAppointment, approvalMode, currentPatientId }) {
  const [view, setView] = useState("day"); // day | week | month
  const [cursor, setCursor] = useState(new Date("2026-08-30"));
  const [newModal, setNewModal] = useState(false);
  const [filterDoctor, setFilterDoctor] = useState("all");

  const iso = (d) => d.toISOString().slice(0, 10);
  const dayLabel = cursor.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" });

  const filtered = appointments.filter((a) => filterDoctor === "all" || a.doctorId === filterDoctor);

  const shiftDay = (n) => setCursor((c) => { const nd = new Date(c); nd.setDate(nd.getDate() + n); return nd; });

  const dayAppts = filtered.filter((a) => a.date === iso(cursor)).sort((a, b) => a.time.localeCompare(b.time));

  const weekStart = new Date(cursor); weekStart.setDate(cursor.getDate() - cursor.getDay() + 1);
  const weekDays = Array.from({ length: 7 }, (_, i) => { const d = new Date(weekStart); d.setDate(weekStart.getDate() + i); return d; });

  const monthStart = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const monthGridStart = new Date(monthStart); monthGridStart.setDate(monthStart.getDate() - ((monthStart.getDay() + 6) % 7));
  const monthCells = Array.from({ length: 42 }, (_, i) => { const d = new Date(monthGridStart); d.setDate(monthGridStart.getDate() + i); return d; });

  return (
    <div className="space-y-4">
      <SectionHeader
        title="Appointments"
        subtitle={role === "admin" ? `Approval workflow: ${approvalMode === "admin" ? "Admin Fixed" : approvalMode === "doctor" ? "Doctor Fixed" : "Automatic Booking"}` : undefined}
        action={
          <div className="flex items-center gap-2 flex-wrap">
            {(role === "admin" || role === "receptionist") && (
              <Select value={filterDoctor} onChange={(e) => setFilterDoctor(e.target.value)} style={{ width: 170 }}>
                <option value="all">All Doctors</option>
                {doctors.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
              </Select>
            )}
            <Button icon={Plus} onClick={() => setNewModal(true)}>{role === "patient" ? "Request Appointment" : "New Appointment"}</Button>
          </div>
        }
      />

      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="flex rounded-xl overflow-hidden" style={{ border: `1px solid ${C.border}` }}>
          {["day", "week", "month"].map((v) => (
            <button key={v} onClick={() => setView(v)} className="px-4 py-2 text-sm font-semibold capitalize" style={{ background: view === v ? C.teal700 : "#fff", color: view === v ? "#fff" : C.sub }}>
              {v}
            </button>
          ))}
        </div>
        {view !== "month" && (
          <div className="flex items-center gap-2">
            <button onClick={() => shiftDay(view === "day" ? -1 : -7)} className="p-2 rounded-lg" style={{ border: `1px solid ${C.border}` }}><ChevronLeft size={16} /></button>
            <span className="text-sm font-semibold" style={{ color: C.ink }}>{dayLabel}</span>
            <button onClick={() => shiftDay(view === "day" ? 1 : 7)} className="p-2 rounded-lg" style={{ border: `1px solid ${C.border}` }}><ChevronRight size={16} /></button>
          </div>
        )}
      </div>

      {view === "day" && (
        <Card className="p-4">
          {dayAppts.length === 0 && <Empty icon={CalendarDays} title="No appointments on this day" />}
          <div className="space-y-2">
            {dayAppts.map((a) => (
              <AppointmentRow key={a.id} a={a} patientName={patientName} doctorName={doctorName} treatmentName={treatmentName} role={role} updateApptStatus={updateApptStatus} />
            ))}
          </div>
        </Card>
      )}

      {view === "week" && (
        <div className="grid grid-cols-1 sm:grid-cols-7 gap-2">
          {weekDays.map((d) => {
            const dayItems = filtered.filter((a) => a.date === iso(d));
            const isToday = iso(d) === todayISO();
            return (
              <Card key={iso(d)} className="p-3 min-h-[140px]" style={isToday ? { borderColor: C.teal500 } : {}}>
                <div className="text-xs font-bold mb-2" style={{ color: isToday ? C.teal700 : C.sub }}>{d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric" })}</div>
                <div className="space-y-1.5">
                  {dayItems.map((a) => (
                    <div key={a.id} className="text-[11px] px-2 py-1.5 rounded-lg leading-tight" style={{ background: C.teal50, color: C.teal800 }}>
                      <div className="font-semibold">{a.time} · {patientName(a.patientId)}</div>
                      <div style={{ color: C.sub }}>{treatmentName(a.treatmentId)}</div>
                    </div>
                  ))}
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {view === "month" && (
        <Card className="p-4">
          <div className="grid grid-cols-7 gap-1 mb-2">
            {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d) => <div key={d} className="text-[11px] font-bold text-center py-1" style={{ color: C.faint }}>{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {monthCells.map((d) => {
              const count = filtered.filter((a) => a.date === iso(d)).length;
              const inMonth = d.getMonth() === cursor.getMonth();
              const isToday = iso(d) === todayISO();
              return (
                <button key={iso(d)} onClick={() => { setCursor(d); setView("day"); }} className="aspect-square rounded-lg p-1.5 flex flex-col items-start justify-between text-left"
                  style={{ background: isToday ? C.teal50 : "#fff", border: `1px solid ${C.border}`, opacity: inMonth ? 1 : 0.35 }}>
                  <span className="text-[11px] font-semibold" style={{ color: isToday ? C.teal700 : C.ink }}>{d.getDate()}</span>
                  {count > 0 && <span className="text-[9px] font-bold px-1.5 py-0.5 rounded-full self-end" style={{ background: C.teal600, color: "#fff" }}>{count}</span>}
                </button>
              );
            })}
          </div>
        </Card>
      )}

      <NewAppointmentModal open={newModal} onClose={() => setNewModal(false)} doctors={doctors} patients={patients} treatments={treatments}
        onCreate={createAppointment} role={role} currentPatientId={currentPatientId} />
    </div>
  );
}

function NewAppointmentModal({ open, onClose, doctors, patients, treatments, onCreate, role, currentPatientId }) {
  const [patientId, setPatientId] = useState(patients[0]?.id);
  const [doctorId, setDoctorId] = useState(doctors[0]?.id);
  const [treatmentId, setTreatmentId] = useState(treatments[0]?.id);
  const [date, setDate] = useState("2026-08-31");
  const [time, setTime] = useState("10:00");
  const [notes, setNotes] = useState("");

  const submit = () => {
    onCreate({ patientId: role === "patient" ? currentPatientId : patientId, doctorId, treatmentId, date, time, notes });
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} title={role === "patient" ? "Request an Appointment" : "New Appointment"}>
      {role !== "patient" && (
        <Field label="Patient">
          <Select value={patientId} onChange={(e) => setPatientId(e.target.value)}>
            {patients.map((p) => <option key={p.id} value={p.id}>{p.name} — {p.phone}</option>)}
          </Select>
        </Field>
      )}
      <Field label="Doctor">
        <Select value={doctorId} onChange={(e) => setDoctorId(e.target.value)}>
          {doctors.map((d) => <option key={d.id} value={d.id}>{d.name} — {d.specialty}</option>)}
        </Select>
      </Field>
      <Field label="Treatment">
        <Select value={treatmentId} onChange={(e) => setTreatmentId(e.target.value)}>
          {treatments.filter((t) => t.active).map((t) => <option key={t.id} value={t.id}>{t.name} — {fmtINR(t.price)}</option>)}
        </Select>
      </Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Date"><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
        <Field label="Time"><TextInput type="time" value={time} onChange={(e) => setTime(e.target.value)} /></Field>
      </div>
      <Field label="Notes (optional)"><TextInput value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Any additional information" /></Field>
      <Button className="w-full justify-center mt-1" onClick={submit}>{role === "patient" ? "Send Request" : "Create Appointment"}</Button>
    </Modal>
  );
}

function CheckInPage({ patients, appointments, doctorName, treatmentName, outstandingFor, handleCheckIn, todaysAppointments }) {
  const [query, setQuery] = useState("");

  const results = query.length > 0
    ? patients.filter((p) => p.name.toLowerCase().includes(query.toLowerCase()) || p.phone.includes(query) || p.id.includes(query))
    : [];

  const waiting = todaysAppointments.filter((a) => a.status === "Confirmed" || a.status === "Checked In");

  return (
    <div className="space-y-5">
      <SectionHeader title="Patient Check-In" subtitle="Search or select a patient arriving at the clinic to check them in." />
      <Card className="p-4">
        <div className="relative">
          <Search size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2" color={C.faint} />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search by name, phone, patient ID, or appointment ID…"
            className="w-full pl-10 pr-4 py-3 rounded-xl text-sm" style={inputStyle} />
        </div>
        {results.length > 0 && (
          <div className="mt-3 space-y-2">
            {results.map((p) => {
              const appt = appointments.find((a) => a.patientId === p.id && a.date === todayISO());
              const outstanding = outstandingFor(p.id);
              return (
                <div key={p.id} className="flex items-center justify-between p-3 rounded-xl flex-wrap gap-2" style={{ background: C.bg, border: `1px solid ${C.border}` }}>
                  <div className="flex items-center gap-3">
                    <Avatar name={p.name} size={38} />
                    <div>
                      <div className="text-sm font-semibold flex items-center gap-2" style={{ color: C.ink }}>
                        {p.name}
                        {outstanding > 0 && <span className="w-2 h-2 rounded-full" style={{ background: C.red }} title="Pending payment" />}
                      </div>
                      <div className="text-xs" style={{ color: C.sub }}>{p.phone} · {appt ? `${treatmentName(appt.treatmentId)} with ${doctorName(appt.doctorId)} at ${appt.time}` : "No appointment today"}</div>
                    </div>
                  </div>
                  <Button variant={appt ? "primary" : "ghost"} icon={UserCheck} disabled={!appt || appt.status === "Checked In"} onClick={() => handleCheckIn(p.id, appt.id)}>
                    {appt?.status === "Checked In" ? "Already Checked In" : "Check In"}
                  </Button>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      <Card className="p-5">
        <SectionHeader title="Today's Arrivals" subtitle={`${waiting.length} confirmed appointment${waiting.length === 1 ? "" : "s"} today`} />
        <div className="space-y-2">
          {waiting.length === 0 && <Empty icon={UserCheck} title="No confirmed appointments today" />}
          {waiting.map((a) => {
            const p = patients.find((pt) => pt.id === a.patientId);
            const outstanding = outstandingFor(a.patientId);
            return (
              <div key={a.id} className="flex items-center justify-between p-3 rounded-xl flex-wrap gap-2" style={{ background: C.bg, border: `1px solid ${C.border}` }}>
                <div className="flex items-center gap-3">
                  <Avatar name={p.name} size={38} />
                  <div>
                    <div className="text-sm font-semibold" style={{ color: C.ink }}>{p.name}</div>
                    <div className="text-xs" style={{ color: C.sub }}>{a.time} · {treatmentName(a.treatmentId)} · {doctorName(a.doctorId)}</div>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  {outstanding > 0 && <Badge>Payment Due</Badge>}
                  {a.status === "Checked In" ? <Badge>Checked In</Badge> :
                    <Button icon={UserCheck} onClick={() => handleCheckIn(a.patientId, a.id)}>Check In</Button>}
                </div>
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

/* ============================== COLLECT PAYMENT MODAL ============================== */
function CollectPaymentModal({ invoice, onClose, onCollect, qrEnabled, qrImage, upiId }) {
  const [amount, setAmount] = useState("");
  const [method, setMethod] = useState("Cash");

  React.useEffect(() => { if (invoice) setAmount(String(invoice.total - invoice.paid)); }, [invoice]);
  if (!invoice) return null;
  const outstanding = invoice.total - invoice.paid;

  const methods = [
    { key: "Cash", icon: Banknote }, { key: "UPI", icon: Smartphone1 }, { key: "Card", icon: CreditCard },
    ...(qrEnabled ? [{ key: "QR", icon: QrCode }] : []), { key: "Bank Transfer", icon: FileText },
  ];

  return (
    <Modal open={!!invoice} onClose={onClose} title={`Collect Payment — ${invoice.id}`} width={460}>
      <div className="rounded-xl p-4 mb-4" style={{ background: C.teal50 }}>
        <Row label="Total Amount" value={fmtINR(invoice.total)} />
        <Row label="Already Paid" value={fmtINR(invoice.paid)} />
        <Row label="Outstanding" value={<b style={{ color: C.red }}>{fmtINR(outstanding)}</b>} />
      </div>

      <Field label="Amount to Collect">
        <div className="flex gap-2">
          <TextInput type="number" value={amount} onChange={(e) => setAmount(e.target.value)} />
          <Button variant="ghost" onClick={() => setAmount(String(outstanding))}>Full</Button>
        </div>
      </Field>

      <Field label="Payment Method">
        <div className="grid grid-cols-3 gap-2">
          {methods.map((m) => (
            <button key={m.key} onClick={() => setMethod(m.key)} className="flex flex-col items-center gap-1 py-2.5 rounded-xl text-xs font-semibold"
              style={{ background: method === m.key ? C.teal700 : "#fff", color: method === m.key ? "#fff" : C.ink, border: `1px solid ${method === m.key ? C.teal700 : C.border}` }}>
              <m.icon size={16} /> {m.key}
            </button>
          ))}
        </div>
      </Field>

      {method === "QR" && (
        <div className="rounded-xl p-4 mb-3 text-center" style={{ background: C.bg, border: `1px dashed ${C.border}` }}>
          {qrImage ? <img src={qrImage} alt="QR" className="w-32 h-32 mx-auto rounded-lg object-cover" /> : (
            <div className="w-32 h-32 mx-auto rounded-lg flex items-center justify-center" style={{ background: C.teal50 }}>
              <QrCode size={48} color={C.teal600} />
            </div>
          )}
          <div className="text-xs mt-2" style={{ color: C.sub }}>Scan to pay · UPI ID: <b>{upiId}</b></div>
        </div>
      )}

      <Button className="w-full justify-center mt-2" onClick={() => onCollect(invoice.id, Number(amount) || 0, method)} disabled={!amount || Number(amount) <= 0}>
        Confirm Payment of {fmtINR(Number(amount) || 0)}
      </Button>
    </Modal>
  );
}

function NewInvoiceModal({ open, onClose, patients, doctors, treatments, medicines, onCreate }) {
  const [patientId, setPatientId] = useState(patients[0]?.id);
  const [doctorId, setDoctorId] = useState(doctors[0]?.id);
  const [selectedTreatments, setSelectedTreatments] = useState([]);
  const [selectedMeds, setSelectedMeds] = useState([]);
  const [discount, setDiscount] = useState("0");

  const toggleT = (id) => setSelectedTreatments((p) => p.includes(id) ? p.filter((x) => x !== id) : [...p, id]);
  const toggleM = (id) => setSelectedMeds((p) => p.includes(id) ? p.filter((x) => x !== id) : [...p, id]);

  const items = [
    ...selectedTreatments.map((id) => { const t = treatments.find((x) => x.id === id); return { type: "Treatment", name: t.name, qty: 1, amount: t.price }; }),
    ...selectedMeds.map((id) => { const m = medicines.find((x) => x.id === id); return { type: "Medicine", name: m.name, qty: 1, amount: m.price * 10 }; }),
  ];
  const subtotal = items.reduce((s, i) => s + i.amount, 0);
  const total = Math.max(0, subtotal - Number(discount || 0));

  const submit = () => { if (items.length === 0) return; onCreate(patientId, doctorId, items, Number(discount || 0)); onClose(); setSelectedTreatments([]); setSelectedMeds([]); setDiscount("0"); };

  return (
    <Modal open={open} onClose={onClose} title="Create Invoice" width={560}>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Patient"><Select value={patientId} onChange={(e) => setPatientId(e.target.value)}>{patients.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}</Select></Field>
        <Field label="Doctor"><Select value={doctorId} onChange={(e) => setDoctorId(e.target.value)}>{doctors.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}</Select></Field>
      </div>
      <Field label="Treatments">
        <div className="flex flex-wrap gap-1.5">
          {treatments.filter((t) => t.active).map((t) => (
            <button key={t.id} onClick={() => toggleT(t.id)} className="px-2.5 py-1.5 rounded-lg text-xs font-semibold" style={{ background: selectedTreatments.includes(t.id) ? C.teal700 : C.teal50, color: selectedTreatments.includes(t.id) ? "#fff" : C.teal800 }}>
              {t.name} · {fmtINR(t.price)}
            </button>
          ))}
        </div>
      </Field>
      <Field label="Medicines (optional, x10 units)">
        <div className="flex flex-wrap gap-1.5">
          {medicines.filter((m) => m.active).map((m) => (
            <button key={m.id} onClick={() => toggleM(m.id)} className="px-2.5 py-1.5 rounded-lg text-xs font-semibold" style={{ background: selectedMeds.includes(m.id) ? C.teal700 : C.teal50, color: selectedMeds.includes(m.id) ? "#fff" : C.teal800 }}>
              {m.name} · {fmtINR(m.price * 10)}
            </button>
          ))}
        </div>
      </Field>
      <Field label="Discount (₹)"><TextInput type="number" value={discount} onChange={(e) => setDiscount(e.target.value)} /></Field>
      <div className="rounded-xl p-4 mb-3" style={{ background: C.teal50 }}>
        <Row label="Subtotal" value={fmtINR(subtotal)} />
        <Row label="Discount" value={"– " + fmtINR(discount)} />
        <Row label="Total Payable" value={<b>{fmtINR(total)}</b>} />
      </div>
      <Button className="w-full justify-center" onClick={submit} disabled={items.length === 0}>Generate Invoice</Button>
    </Modal>
  );
}

function ReportsPage({ role, invoices, appointments, treatments, doctors, patientName, doctorName, downloadXLSX, downloadCSV, simulatePDF, permissions, sheetsSync, setSheetsSync, sheetsConnected, setSheetsConnected, showToast, currentDoctorId }) {

            <Bar dataKey="value" fill={C.teal600} radius={[0, 6, 6, 0]} />

  const fileRef = useRef(null);

    const file = e.target.files[0];

    const reader = new FileReader();

  const workflows = [
    { key: "admin", title: "Admin Fixed Appointment", desc: "Patient Request → Admin Reviews → Admin Selects Doctor & Time → Confirmed.", icon: ShieldCheck },
    { key: "doctor", title: "Doctor Fixed Appointment", desc: "Patient Request → Admin Assigns Doctor → Doctor Approves Time → Confirmed.", icon: Stethoscope },
    { key: "auto", title: "Automatic Booking", desc: "Patient Selects Slot → System Checks Availability → Confirmed instantly.", icon: RefreshCw },
  ];

  const permList = [
    { key: "receptionistBilling", label: "Receptionist can collect payments" },
    { key: "receptionistReschedule", label: "Receptionist can reschedule appointments" },
    { key: "downloadExcel", label: "Allow Excel report downloads" },
    { key: "downloadCSV", label: "Allow CSV report downloads" },
    { key: "downloadPDF", label: "Allow PDF report downloads" },
    { key: "doctorReports", label: "Doctors can download their own reports" },
    { key: "financialReports", label: "Doctors can view clinic-wide financial reports" },
  ];

  return (
    <div className="space-y-5">
      <SectionHeader title="Clinic Settings" subtitle="Configure workflow, payments, and permissions." />

      <Card className="p-5">
        <SectionHeader title="Appointment Approval Workflow" />
        <div className="grid md:grid-cols-3 gap-3">
          {workflows.map((w) => {
            const Icon = w.icon;
            const active = approvalMode === w.key;
            return (
              <button key={w.key} onClick={() => { setApprovalMode(w.key); showToast(`Workflow set to "${w.title}".`); }}
                className="text-left p-4 rounded-xl transition" style={{ background: active ? C.teal700 : C.bg, border: `1px solid ${active ? C.teal700 : C.border}` }}>
                <Icon size={18} color={active ? "#fff" : C.teal700} />
                <div className="font-semibold text-sm mt-2" style={{ color: active ? "#fff" : C.ink }}>{w.title}</div>
                <div className="text-xs mt-1" style={{ color: active ? "#D7EDE8" : C.sub }}>{w.desc}</div>
              </button>
            );
          })}
        </div>
      </Card>

      <Card className="p-5">
        <SectionHeader title="QR Payment" subtitle="Optional — never required for checkout." />
        <div className="flex items-center justify-between p-3.5 rounded-xl mb-3" style={{ background: C.bg }}>
          <div>
            <div className="text-sm font-semibold" style={{ color: C.ink }}>Enable QR Payment</div>
            <div className="text-xs" style={{ color: C.sub }}>Show QR as a payment option at checkout</div>
          </div>
          <ToggleButton on={qrEnabled} onClick={() => setQrEnabled((v) => !v)} />
        </div>
        {qrEnabled && (
          <div className="grid sm:grid-cols-2 gap-4">
            <div>
              <Field label="UPI ID"><TextInput value={upiId} onChange={(e) => setUpiId(e.target.value)} /></Field>
              <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleUpload} />
              <Button variant="subtle" icon={Upload} onClick={() => fileRef.current.click()}>{qrImage ? "Replace QR Code" : "Upload QR Code"}</Button>
            </div>
            <div className="rounded-xl p-4 text-center" style={{ background: C.teal50 }}>
              {qrImage ? <img src={qrImage} className="w-28 h-28 mx-auto rounded-lg object-cover" alt="QR" /> : <QrCode size={64} color={C.teal600} className="mx-auto" />}
              <div className="text-xs mt-2" style={{ color: C.teal800 }}>Preview</div>
            </div>
          </div>
        )}
      </Card>

      <Card className="p-5">
        <SectionHeader title="User Permissions" subtitle="Control access for staff and doctors." />
        <div className="space-y-2">
          {permList.map((p) => (
            <div key={p.key} className="flex items-center justify-between p-3 rounded-xl" style={{ background: C.bg }}>
              <span className="text-sm" style={{ color: C.ink }}>{p.label}</span>
              <ToggleButton on={permissions[p.key]} onClick={() => setPermissions((prev) => ({ ...prev, [p.key]: !prev[p.key] }))} />
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

/* ============================== AUDIT LOG ============================== */
function AuditPage({ auditLog }) {
  return (
    <div className="space-y-4">
      <SectionHeader title="Audit History" subtitle="Every important action is recorded automatically." />
      <Card className="p-0 overflow-hidden">
        {auditLog.map((a, i) => (
          <div key={a.id} className="flex items-start gap-3 p-4" style={{ borderTop: i > 0 ? `1px solid ${C.border}` : "none" }}>
            <div className="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style={{ background: C.teal50 }}>
              <ClipboardCheck size={14} color={C.teal600} />
            </div>
            <div className="min-w-0 flex-1">
              <div className="text-sm" style={{ color: C.ink }}><b>{a.user}</b> — {a.action}</div>
              <div className="text-[11px] mt-0.5" style={{ color: C.faint }}>{a.time}</div>
            </div>
          </div>
        ))}
      </Card>
    </div>
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(React.createElement(SmartDentalCare));

</script>

<script type="module">
  function showError(err) {
    const box = document.getElementById('error-box');
    box.style.display = 'block';
    box.textContent = 'Failed to load Smart Dental Care:\n\n' + (err && err.stack ? err.stack : err);
    const loading = document.getElementById('loading');
    if (loading) loading.remove();
  }

  try {
    // Load React/ReactDOM/lucide-react/recharts/xlsx as ES modules from a CDN
    async function loadModule(urls) {
      let lastErr;
      for (const url of urls) {
        try {
          return await import(url);
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr;
    }

    // Load a classic (non-module) script from the first CDN that responds.
    // Individual CDN hosts can fail intermittently on some networks, so we
    // retry across a few mirrors rather than depending on a single one.
    function loadClassicScript(urls, checkLoaded) {
      return new Promise((resolve, reject) => {
        let i = 0;
        function tryNext() {
          if (checkLoaded && checkLoaded()) { resolve(); return; }
          if (i >= urls.length) { reject(new Error('All CDN sources failed: ' + urls.join(', '))); return; }
          const url = urls[i++];
          const s = document.createElement('script');
          s.src = url;
          s.onload = () => {
            if (!checkLoaded || checkLoaded()) resolve();
            else tryNext();
          };
          s.onerror = tryNext;
          document.head.appendChild(s);
        }
        tryNext();
      });
    }

    // Fetch Babel Standalone (needed to transpile the embedded JSX below)
    // from whichever CDN mirror is reachable.
    await loadClassicScript([
      'https://unpkg.com/@babel/standalone@7/babel.min.js',
      'https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js',
    ], () => typeof window.Babel !== 'undefined');

    const [React, ReactDOMClient, LucideIcons, Recharts, XLSX] = await Promise.all([
      loadModule([
        'https://esm.sh/react@18.3.1',
        'https://unpkg.com/react@18.3.1?module',
        'https://cdn.jsdelivr.net/npm/react@18.3.1/+esm',
      ]),
      loadModule([
        'https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1',
        'https://unpkg.com/react-dom@18.3.1/client?module',
        'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/client/+esm',
      ]),
      loadModule([
        'https://esm.sh/lucide-react@0.263.1?deps=react@18.3.1',
        'https://unpkg.com/lucide-react@0.263.1?module',
        'https://cdn.jsdelivr.net/npm/lucide-react@0.263.1/+esm',
      ]),
      loadModule([
        'https://esm.sh/recharts@2.12.7?deps=react@18.3.1,react-dom@18.3.1',
        'https://unpkg.com/recharts@2.12.7?module',
        'https://cdn.jsdelivr.net/npm/recharts@2.12.7/+esm',
      ]),
      loadModule([
        'https://esm.sh/xlsx@0.18.5',
        'https://unpkg.com/xlsx@0.18.5?module',
        'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm',
      ]),
    ]);

    // Expose as globals so the Babel-transformed (non-module) app script can see them
    window.React = React.default ?? React;
    window.ReactDOM = ReactDOMClient.default ?? ReactDOMClient;
    window.LucideIcons = LucideIcons;
    window.Recharts = Recharts;
    window.XLSX = XLSX.default ?? XLSX;

    // Grab the embedded JSX source and transform it with Babel standalone
    const source = document.getElementById('app-source').textContent;
    const transformed = Babel.transform(source, {
      presets: ['react'],
      filename: 'app.jsx',
    }).code;

    // Run the transformed code (it renders into #root itself)
    (0, eval)(transformed);

    const loading = document.getElementById('loading');
    if (loading) loading.remove();
  } catch (err) {
    console.error(err);
    showError(err);
  }
</script>

</body>
